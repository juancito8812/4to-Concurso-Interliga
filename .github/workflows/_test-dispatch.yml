name: _TEST dispatch pages deploy

# Workflow TEMPORAL de verificación: comprueba que un workflow con
# `permissions: actions: write` y GITHUB_TOKEN puede disparar deploy.yml.
# Se elimina inmediatamente tras verificar.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch Pages deploy with GITHUB_TOKEN
        run: |
          gh workflow run deploy.yml --ref main
          echo "dispatch enviado OK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
