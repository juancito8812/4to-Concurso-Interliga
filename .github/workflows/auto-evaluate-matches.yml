name: Auto-Sync ESPN Match Results & Score Predictions

on:
  schedule:
    # Cada 30 min: GitHub retrasa los schedules bajo carga y con 2 h los
    # resultados del día podían tardar 4-6 h en reflejarse (incidente 2026-10-20).
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Necesario para disparar deploy.yml: los push hechos con GITHUB_TOKEN no
  # generan eventos de workflow, pero workflow_dispatch SÍ es la excepción.
  actions: write

jobs:
  sync-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync kickoff times from ESPN
        # football-data.org guarda 00:00Z cuando la TV no confirma horario; el
        # script lo corrige con la hora real de ESPN (ventana ±10 días) en DB y
        # en los JSON de fixtures, para que la ventana de pronóstico cierre a
        # la hora real del pitazo.
        run: node scripts/sync-kickoff-times.js --write
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Sync kickoff times from ESPN
        # football-data.org guarda 00:00Z cuando la TV aún no confirma horario;
        # el script lo corrige con la hora real de ESPN (ventana -14/+10 días)
        # en la DB y en los JSON de fixtures, para que la ventana de pronóstico
        # cierre a la hora real del pitazo.
        run: node scripts/sync-kickoff-times.js --write
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Sync finished match results from ESPN
        run: node scripts/auto-sync-espn-results.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit & push updated results if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/officialEvaluatedMatches.json src/data/officialEvaluatedPredictions.json public/data/officialEvaluatedMatches.json public/data/officialEvaluatedPredictions.json src/data/officialFixtures.json public/data/officialFixtures.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los JSON de resultados."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(cron): auto-sync finished match results from ESPN"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Pages deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
