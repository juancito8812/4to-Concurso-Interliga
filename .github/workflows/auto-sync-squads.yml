name: Auto-Sync Official Player Squads

on:
  schedule:
    # Runs on the 1st day of every month at 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  # Necesario para disparar deploy.yml: los push hechos con GITHUB_TOKEN no
  # generan eventos de workflow, pero workflow_dispatch SÍ es la excepción.
  actions: write

jobs:
  sync-squads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync player squads from official sources
        run: node scripts/sync-player-squads.js

      - name: Commit & push updated squads if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/officialPlayers.json public/data/officialPlayers.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la plantilla de jugadores."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(cron): auto-sync monthly player squads update"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Pages deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
